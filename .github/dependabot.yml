version: 2
# One pull request for all image updates, from Dockerfiles and compose files
# in every directory.
multi-ecosystem-groups:
  docker-images:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo:
        patterns: ["*"]
    allow:
      - dependency-type: all
    ignore:
      # New axum major and minor versions usually have breaking changes, see #790 for axum 0.8
      - dependency-name: "axum"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "axum-extra"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "docker"
    directories: ["/playwright/docker", "/deploy", "/development"]
    patterns: ["*"]
    multi-ecosystem-group: "docker-images"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker-compose"
    directories: ["/", "/playwright"]
    patterns: ["*"]
    multi-ecosystem-group: "docker-images"
    cooldown:
      default-days: 7
