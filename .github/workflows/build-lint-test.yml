name: Build, lint & test

permissions: {}
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-build-lint-test
  # Never cancel main runs: they upload the test-server binary and create releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main

env:
  TZ: "Europe/Amsterdam"

jobs:
  changes:
    name: Detect changes
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
      models_changed: ${{ steps.filter.outputs.models_changed }}
    steps:
      - &checkout-with-history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      - name: Detect which files changed
        id: filter
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            echo "models_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files() {
            git diff --name-only "origin/${GITHUB_BASE_REF}" HEAD -- "$@"
          }

          if [[ -n $(changed_files . ':(exclude)docs' ':(exclude,glob)*.md' ':(exclude,glob)**/README.md') ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n $(changed_files src/models Cargo.lock development/src/bin/pdf_diff.rs .github/workflows/build-lint-test.yml .github/scripts/comment-pdf-diff-summary.js) ]]; then
            echo "models_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "models_changed=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: Rust format
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        shell: bash
        run: >
          rustup update nightly &&
          rustup default nightly &&
          rustup component add --toolchain nightly rustfmt

      - name: Check rustfmt
        run: cargo fmt --all -- --check

  frontend:
    name: Frontend lint
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      # Version is read from development/setup.yml
      - name: Install biome
        run: |
          version=$(yq '.tools[] | select(.name == "biome") | .version' development/setup.yml)
          sha256=$(yq '.tools[] | select(.name == "biome") | .sha256["biome-linux-x64-musl"]' development/setup.yml)
          curl --proto '=https' -fsSLo bin/biome "https://github.com/biomejs/biome/releases/download/@biomejs/biome@${version}/biome-linux-x64-musl"
          echo "${sha256}  bin/biome" | sha256sum -c -
          chmod +x bin/biome
          bin/biome --version

      - name: Build djlint image
        run: docker build --build-arg "UID=$(id -u)" --build-arg "GID=$(id -g)" -f development/djlint.Dockerfile -t djlint .

      - name: Lint Typescript, CSS and playwright tests using Biome
        run: ./bin/biome ci --error-on-warnings ./frontend/scripts ./frontend/styles ./playwright/tests

      - name: Lint HTML with djlint
        run: |
          docker run --rm \
          -v ./src:/work/templates \
          -v ./djlint.toml:/work/djlint.toml \
          djlint \
          djlint --lint --check --configuration=djlint.toml templates

  lockfile:
    name: Cargo.lock up to date
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      - &setup-stable-rust
        name: Setup Rust
        shell: bash
        run: >
          rustup update stable &&
          rustup default stable &&
          rustup component add --toolchain stable clippy

      - name: Check Cargo.lock against Cargo.toml
        run: cargo tree --locked --depth 0 > /dev/null

  rust-lint:
    name: Rust lint & test
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: &rust-check-env
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - *checkout
      - *setup-stable-rust

      # For the sqlx tests; uses compose.yml so Dependabot keeps one image pin up to date
      - name: Start postgres
        run: docker compose up --detach --wait --quiet-pull psql

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-lint

      # Version is read from development/setup.yml
      - &install-esbuild
        name: Install esbuild
        run: |
          version=$(yq '.tools[] | select(.name == "esbuild") | .version' development/setup.yml)
          sha256=$(yq '.tools[] | select(.name == "esbuild") | .sha256["linux-x64"]' development/setup.yml)
          curl -fsSo esbuild.tgz "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${version}.tgz"
          echo "${sha256}  esbuild.tgz" | sha256sum -c -
          tar -xzf esbuild.tgz --strip-components=2 -C bin package/bin/esbuild
          rm esbuild.tgz
          bin/esbuild --version

      - name: Bundle frontend assets
        run: >
          bin/esbuild --bundle frontend/index.ts --outdir=frontend/static
          --minify --sourcemap --define:IS_PRODUCTION=true
          --loader:.woff2=file --loader:.svg=file --public-path=/static/

      - name: Check Clippy with all features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check Clippy without default features
        run: cargo clippy --locked --workspace --all-targets --no-default-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features -- --nocapture

      - name: Build docs
        run: cargo doc --locked --workspace --no-deps --all-features --document-private-items

      - name: Add redirect to main crate docs
        if: ${{ github.event_name == 'push' }}
        run: echo '<meta http-equiv="refresh" content="0; url=eks/index.html">' > target/doc/index.html

      - name: Upload Pages artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './target/doc'

  dylint:
    name: Rust dylint
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - *checkout
      - *setup-stable-rust

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-dylint

      # The version is the last argument of the install_dylint command in development/setup.yml
      - name: Read dylint version
        id: dylint_version
        run: |
          version=$(yq '.commands.install_dylint.args[-1]' development/setup.yml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install cargo-dylint
        env:
          VERSION: ${{ steps.dylint_version.outputs.version }}
          # sha256 of the v6.3.0 tarballs; update together with the version in development/setup.yml
          CARGO_DYLINT_SHA256: 2932ea7e589a47236ec92681b9b5e41af42266c6fa2b8a16f03f53b601a09127
          DYLINT_LINK_SHA256: a5d3268ff24269cdb7da42126720f13c24869098bd4b152f6a95ed9e9f8e82f4
        run: |
          for tool in cargo-dylint dylint-link; do
            curl --proto '=https' -fsSLo "${tool}.tar.gz" "https://github.com/trailofbits/dylint/releases/download/v${VERSION}/${tool}-x86_64-unknown-linux-gnu-v${VERSION}.tar.gz"
          done
          sha256sum -c - <<EOF
          ${CARGO_DYLINT_SHA256}  cargo-dylint.tar.gz
          ${DYLINT_LINK_SHA256}  dylint-link.tar.gz
          EOF
          for tool in cargo-dylint dylint-link; do
            tar -xzf "${tool}.tar.gz" --strip-components=1 -C ~/.cargo/bin "${tool}-x86_64-unknown-linux-gnu-v${VERSION}/${tool}"
            rm "${tool}.tar.gz"
          done
          cargo dylint --version

      - name: Dylint driver cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dylint_drivers
          key: dylint-drivers-v1-${{ steps.dylint_version.outputs.version }}-${{ hashFiles('dylint.toml') }}

      # Builds the lint libraries in dylint.toml with their pinned nightly,
      # then type-checks the crate with them enabled.
      - name: Run dylint
        run: cargo dylint --all -- --locked

  deploy-docs:
    name: Deploy Rustdocs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: rust-lint
    environment:
      name: Rust crate documentation
      url: ${{ steps.deployment.outputs.page_url }}eks
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to publish docs to the pages url of the repo
      id-token: write # to verify the source of the pages deployment
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  pdf-diff:
    name: PDF diff
    permissions:
      contents: read
      pull-requests: write # Need to be able to comment on the PR
    if: ${{ needs.changes.outputs.models_changed == 'true' && github.event_name == 'pull_request' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: *rust-check-env
    steps:
      # pdf_diff checks origin/main out into a worktree to build the baseline,
      # so it needs history.
      - *checkout-with-history
      - *setup-stable-rust

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-pdf-diff

      - name: Install diff-pdf
        run: sudo apt-get update && sudo apt-get install -y diff-pdf-wx

      - name: Generate PDF diff summary
        run: cargo run --locked --release -p eks-development --features pdf-diff --bin pdf_diff

      - name: Check for diff artifacts
        id: diff-artifacts
        shell: bash
        run: |
          if find tmp/diffs -type f | read -r _; then
            echo "has_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload diff artifacts
        if: ${{ steps.diff-artifacts.outputs.has_artifacts == 'true' }}
        id: artifact-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-diffs
          path: tmp/diffs/

      - name: Comment on PR with PDF diff summary and link to artifact
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_URL: ${{ steps.diff-artifacts.outputs.has_artifacts == 'true' && steps.artifact-upload.outputs.artifact-url || '' }}
        with:
          script: |
            const commentPdfDiffSummary = require('./.github/scripts/comment-pdf-diff-summary');
            await commentPdfDiffSummary({ github, context });

  build:
    name: Build and upload binary to test server
    permissions:
      contents: read
    environment: development
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    env: *rust-check-env
    steps:
      - *checkout
      - *setup-stable-rust

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-build

      - *install-esbuild

      - name: Build
        env:
          CARGO_SET_FEATURES: "memory-serve,database,migrations,fixtures,dev-features,tls,acme,tvs-mock"
        run: bin/build

      - name: Strip debug symbols
        run: strip target/release/eks

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eks
          path: target/release/eks

      - name: Upload binary to test server
        env:
          ETES_API_KEY: ${{ secrets.ETES_API_KEY }}
          SHA_PR: ${{ github.event.pull_request.head.sha || github.sha }}
          SHA_GH: ${{ github.sha }}
        run: |
          curl -s -v \
          --fail \
          -H "Authorization: Bearer $ETES_API_KEY" \
          -T ./target/release/eks \
          https://eks-test.nl/etes/api/v1/executable/${SHA_PR}/${SHA_GH}

  # One runner per browser: the suite is CPU-bound on a 4-vCPU runner.
  playwright-browser:
    name: Playwright tests (${{ matrix.project }})
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - *checkout

      - name: Setup Rust
        shell: bash
        run: >
          rustup update stable

      # Own key: builds eks with the dev feature set (incl. /dev/login).
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-playwright

      - *install-esbuild

      - name: Run playwright tests
        env:
          PROJECT: ${{ matrix.project }}
        run: bin/test --project="$PROJECT"

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright/playwright-report/
          retention-days: 30

  # Keeps the required "Playwright tests" check over the per-browser jobs.
  playwright:
    name: Playwright tests
    permissions: {}
    if: ${{ always() }}
    needs: playwright-browser
    runs-on: ubuntu-24.04
    steps:
      - name: Check per-browser results
        env:
          RESULT: ${{ needs.playwright-browser.result }}
        run: '[[ "$RESULT" == "success" || "$RESULT" == "skipped" ]]'

  audit-dependencies:
    name: Audit dependencies
    permissions:
      contents: read
    if: ${{ needs.changes.outputs.code_changed == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - *checkout

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          arguments: --workspace --all-features --locked

  zizmor:
    name: Lint workflow files with zizmor
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - *checkout

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  release-check:
    name: Check if version bumped
    permissions:
      contents: read
    needs:
      - format
      - frontend
      - rust-lint
      - dylint
      - build
      - playwright
      - audit-dependencies
      - zizmor
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_exists: ${{ steps.release_check.outputs.release_exists }}
    steps:
      - *checkout

      - name: Read version
        id: version
        run: |
          version=$(awk -F' *= *' '$1 == "version" { gsub(/"/, "", $2); print $2; exit }' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release existence
        id: release_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = process.env.CURRENT_VERSION;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('release_exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('release_exists', 'false');
              } else {
                throw error;
              }
            }

  release-build:
    name: Build release assets
    permissions:
      contents: read
    needs: release-check
    if: needs.release-check.outputs.release_exists == 'false'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *setup-stable-rust

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-release

      - *install-esbuild

      - name: Build production binary
        env:
          CARGO_SET_FEATURES: "memory-serve,database,tls,acme"
        run: bin/build

      - name: Strip debug symbols
        run: strip target/release/eks

      - name: Download test binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eks
          path: bin-test

      - name: Install cargo-sbom
        uses: psastras/sbom-rs/actions/install-cargo-sbom@9ecc460b937ac5558c4f8ebebc9e07d2bdbef67b # v0.10.0

      - name: Collect release assets
        run: |
          mkdir release
          mv target/release/eks release/eks
          mv bin-test/eks release/eks-test
          cargo-sbom --output-format=cyclone_dx_json_1_6 > release/cyclone-dx-1-6-sbom.json
          cargo-sbom --output-format=spdx_json_2_3 > release/spdx-2-3-sbom.json

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  release:
    name: Create release
    permissions:
      contents: write # needs write permission to create a release in the repo
    needs: [release-check, release-build]
    concurrency:
      group: create-release
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-check.outputs.version }}
        run: |
          # A concurrent main run may have released this version in the meantime
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
          release/cyclone-dx-1-6-sbom.json \
          release/spdx-2-3-sbom.json \
          "release/eks#eks (production)" \
          "release/eks-test#eks-test (test build, includes fixtures and TVS mock)" \
          --title "Version $TAG" \
          --generate-notes \
          --target "$GITHUB_SHA"
