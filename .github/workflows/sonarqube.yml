name: SonarQube

permissions:
  contents: read
concurrency:
  group: 
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-sonarqube
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    permissions:
      contents: read
    environment:
      name: development
      deployment: false # only needs the secrets
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      TZ: "Europe/Amsterdam"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      # Branch coverage requires Rust nightly: https://github.com/taiki-e/cargo-llvm-cov/issues/8
      - name: Setup Rust Nightly
        shell: bash
        run: >
          rustup update nightly &&
          rustup default nightly

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-sonarqube

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov

      # Only esbuild and Postgres are needed, as in build-lint-test.yml.
      # Keep the esbuild version in sync with development/setup.yml.
      - name: Install esbuild
        run: |
          curl -fsSo esbuild.tgz "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.2.tgz"
          tar -xzf esbuild.tgz --strip-components=2 -C bin package/bin/esbuild
          rm esbuild.tgz
          bin/esbuild --version

      - name: Bundle frontend assets
        run: >
          bin/esbuild --bundle frontend/index.ts --outdir=frontend/static
          --minify --sourcemap --define:IS_PRODUCTION=true
          --loader:.woff2=file --loader:.svg=file --public-path=/static/

      # The sqlx tests connect to the dev Postgres from compose.yml.
      - name: Start Postgres
        run: |
          docker compose up --quiet-pull --detach psql
          for _ in $(seq 20); do
            docker compose exec -T psql pg_isready -U eks && exit 0
            sleep 1
          done
          exit 1

      - name: Generate code coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=lcov.info
