name: SonarQube

permissions:
  contents: read
concurrency:
  group: 
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-sonarqube
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    permissions:
      contents: read
    environment:
      name: development
      deployment: false # only needs the secrets
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      TZ: "Europe/Amsterdam"
    # For the sqlx tests; mirrors compose.yml
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eks
          POSTGRES_DB: eks
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U eks" --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: '0'
          persist-credentials: false

      # Branch coverage requires Rust nightly: https://github.com/taiki-e/cargo-llvm-cov/issues/8
      - name: Setup Rust Nightly
        shell: bash
        run: >
          rustup update nightly &&
          rustup default nightly

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: eks-sonarqube

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov

      # Version is read from development/setup.yml
      - name: Install esbuild
        run: |
          version=$(yq '.tools[] | select(.name == "esbuild") | .version' development/setup.yml)
          curl -fsSo esbuild.tgz "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${version}.tgz"
          tar -xzf esbuild.tgz --strip-components=2 -C bin package/bin/esbuild
          rm esbuild.tgz
          bin/esbuild --version

      - name: Bundle frontend assets
        run: >
          bin/esbuild --bundle frontend/index.ts --outdir=frontend/static
          --minify --sourcemap --define:IS_PRODUCTION=true
          --loader:.woff2=file --loader:.svg=file --public-path=/static/

      - name: Generate code coverage
        run: cargo llvm-cov --locked --all-features --workspace --lcov --output-path lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=lcov.info
