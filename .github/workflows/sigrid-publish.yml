name: Sigrid Publish

permissions:
  contents: read
concurrency:
  group: 
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-sigrid-publish
  cancel-in-progress: true

on:
  push:
    branches:
      - main

jobs:
  sigridci:
    name: Sigrid CI
    if: github.repository == 'kiesraad/e-ks'
    environment:
      name: development
      deployment: false # only needs the secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sigrid CI
        uses: Software-Improvement-Group/sigridci@9e47c391c909aaa34a8f7bbb05794a189411f3d7 # main
        with:
          customer: kiesraad
          system: e-ks
          convert: rust
          publishonly: true
        env:
          SIGRID_CI_TOKEN: "${{ secrets.SIGRID_CI_TOKEN }}"
