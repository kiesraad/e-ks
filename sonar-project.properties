sonar.projectKey=kiesraad_e-ks
sonar.organization=kiesraad
sonar.tests=playwright/tests
sonar.test.inclusions=playwright/tests/**/*.ts
sonar.exclusions=target/**,frontend/static/**,**/node_modules/**,**/playwright-report/**,**/playwright/test-results/**
sonar.sources=./
sonar.plsql.file.suffixes=tab,pkb
sonar.coverage.exclusions=**/*.ts,**/*.js
# Election configs are tabular data: elections sharing the same dates is not duplicated logic
sonar.cpd.exclusions=src/core/election/configs.rs
# Tag + digest is intentional: the digest pins the image, the tag lets Dependabot track versions
sonar.issue.ignore.multicriteria=d1
sonar.issue.ignore.multicriteria.d1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.d1.resourceKey=**/*
