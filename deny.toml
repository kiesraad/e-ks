[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

all-features = true

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "EUPL-1.2",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "ring", use-instead = "aws-lc-sys" },
]
multiple-versions = "allow"

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 pulled transitively by bergshamra-crypto (XML-DSig/XML-Enc); no patched release available upstream (rsa 0.10 is still a release candidate). The only private-key operation is RSA-OAEP unwrapping of an EncryptedID, which is reached only after the RD signature on the ArtifactResponse has been verified, so a chosen-ciphertext timing oracle is not reachable. The same rsa 0.9 is reached through crypto-glue by webauthn-rs, which only verifies RSA-signed WebAuthn attestations and assertions (public-key operations). Revisit when bergshamra publishes a release on a constant-time rsa." },
]

[sources]
allow-git = []
