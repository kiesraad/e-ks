[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

all-features = true

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "EUPL-1.2",
    "ISC",
    "Zlib",
    "BSD-2-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "ring", use-instead = "aws-lc-sys" },
]
multiple-versions = "allow"

[advisories]
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 pulled transitively by bergshamra-crypto (XML-DSig/XML-Enc); no patched release available upstream (rsa 0.10 is still a release candidate). The only private-key operation is RSA-OAEP unwrapping of an EncryptedID, which is reached only after the RD signature on the ArtifactResponse has been verified, so a chosen-ciphertext timing oracle is not reachable. Revisit when bergshamra publishes a release on a constant-time rsa." },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); only affects ZipArchive::extract / ZipStreamReader::extract, which docx-rs does not call. Revisit when docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); only affects ZipArchive::extract, which docx-rs does not call. Revisit when docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); only affects ZipArchive::extract / ZipStreamReader::extract, which docx-rs does not call. Revisit when docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); only affects ZipArchive::extract, which docx-rs does not call. Revisit when docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0545", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); affects reading AES-encrypted entries with the aes-crypto feature, which is disabled in our dependency graph. Revisit if zip features change or docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0546", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); affects ZipArchive::extract / ZipArchive::extract_unwrapped_root_dir, which docx-rs does not call. Revisit when docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0547", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); affects legacy decompression with the legacy-zip feature, which is disabled in our dependency graph. Revisit if zip features change or docx-rs moves to zip >= 9." },
    { id = "RUSTSEC-2026-0548", reason = "zip 8.6 pulled transitively by docx-rs (via textris-pdf); affects ZipStreamReader / read_zipfile_from_stream header consistency, which docx-rs does not use. Its reader uses ZipArchive instead. Revisit when docx-rs moves to zip >= 9.0.5." },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml (unmaintained) pulled transitively by askama_derive via the `config` feature, which we need for askama.toml. Only used at compile time by the proc-macro to parse our own askama.toml, so it never runs in the binary. Revisit when askama-rs/askama#594 is resolved." },
    { id = "RUSTSEC-2026-0543", reason = "chrono (unmaintained) is no longer a direct dependency, we use jiff. It is still pulled transitively by eml-nl (date types in its API) and by tsp-ltv (via bergshamra-keys, XML-DSig/XML-Enc). Revisit when eml-nl and bergshamra move off chrono." },
]

[sources]
allow-git = []
