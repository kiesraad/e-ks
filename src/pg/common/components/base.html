<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ "common.description"|trans }}" />
    <meta name="keywords" content="{{ "common.keywords"|trans }}" />
    <title>
      {%- if browser_title is defined -%}
        {{ browser_title }}
      {%- else if overlay_title is defined -%}
        {{ overlay_title }}
      {%- else if page_title is defined -%}
        {{ page_title }}
      {%- else -%}
        {{ "common.overview"|trans }}
      {%- endif %} - {{ "common.app_name"|trans }}
      {% if let Some(election) = "election"|optional_election_value %}
        {{ election.code() }}
        {% if let Some(domain) = election.domain_title() %}{{ domain }}{% endif %}
      {% endif %}
    </title>
    <link rel="icon" href="/static/favicon.svg" />
    <link rel="stylesheet" href="{{ filters::asset_path("/index.css") }}" />
    {% if Context::livereload_enabled() %}<script src="/livereload/poll.js"></script>{% endif %}
    <script src="{{ filters::asset_path("/index.js") }}" defer></script>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
  </body>
</html>
