{% extends "pg/common/components/base.html" %}

      <span class="login-kiesraad-logo" role="img" aria-label="Kiesraad"></span>
      <h1>{{ "auth.start.app_title"|trans }}</h1>
      <p class="text-balance">{{ "auth.start.app_description"|trans }}</p>
