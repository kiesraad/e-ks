[package]
name = "loadtest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "rustls", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
csv = "1"
rand = "0.10"
url = "2"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
