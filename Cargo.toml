[workspace]
members = ["validate", "auth-service", "development", "tools/locales", "tools/utils", "tools/districts-codegen"]
resolver = "3"

# Fields shared by every crate in the workspace. Individual crates inherit these
# via `edition.workspace = true` etc. Versions are intentionally NOT shared: each
# crate is versioned independently.
[workspace.package]
edition = "2024"
license = "EUPL-1.2"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
unwrap_used = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
empty_line_after_outer_attr = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
wildcard_imports = "warn"

# Single source of truth for third-party dependency versions and their base
# feature set. Member crates opt in with `<dep> = { workspace = true }` and may
# add extra features or mark the dependency optional. Path and git dependencies
# whose requirements diverge between crates stay local to the crate that uses
# them.
[workspace.dependencies]
# tokio universe
axum = { version = "0.8.9" }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rustls = "0.23.40"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls", "rcgen", "x509-parser"] }
x509-parser = { version = "0.18.1", default-features = false }
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
time = { version = "0.3.53", default-features = false, features = ["std"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "parking_lot", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["csrf", "set-header", "trace"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
bytes = "1.11.1"
tokio-util = { version = "0.7", features = ["io"] }

# rust-lang
regex = "1.12.3"

# blessed.rs / dtolnay
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7"
thiserror = "2"

# blessed.rs
chrono = { version = "0.4.44", default-features = false, features = ["alloc", "std", "serde"] }
parking_lot = "0.12.5"
rand = "0.10.1"
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
subtle = { version = "2.6.1", default-features = false }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros", "migrate"] }
uuid = { version = "1.23.2", features = ["serde", "v4", "v5", "v8"] }
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }

# well maintained + many downloads
askama = { version = "0.16.0", default-features = false, features = ["config", "derive", "std"] } # 38M downloads (Dirkjan Ochtman)
async_zip = { version = "0.0.19", features = ["tokio", "deflate"] } # 5M downloads (Harry Majored)
chrono-tz = "0.10.4" # 125M downloads (Dirkjan Ochtman)
csv = "1.4.0" # 203M downloads (Andrew Gallant)
phf = { version = "0.14.0", default-features = false } # 411M downloads (Steven Fackler)
phf_codegen = "0.14.0"
aes-gcm = "0.11.0" # 118M downloads (RustCrypto)
hkdf = "0.13.0" # 198M downloads (RustCrypto)
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] } # 42M downloads (James Munns)
secrecy = "0.10.3" # 126M downloads (Tony Arcieri)
urlencoding = "2.1.3" # 213M downloads (Kornel)
zeroize = "1.9.0" # 359M downloads (RustCrypto)

# development tooling
dotenvy = "0.15.7"
saphyr = { version = "0.0.12", default-features = false }
serde-saphyr = { version = "1.0.0", default-features = false, features = ["deserialize"] }

# tweedegolf
memory-serve = "2.1.0"
textris-pdf = { version = "0.10.3", features = ["docx"] }
bagatel = "0.8.3"

# kiesraad
eml-nl = { git = "https://github.com/kiesraad/rust-eml-nl", rev = "e9fcd7e90aebba463a36d7bbf7cd418f2032ed26" }

# dev-dependencies
futures-lite = { version = "2.1.0", default-features = false, features = ["std"] }
http-body-util = "0.1"
tower = "0.5"
tracing-test = "0.2.6"

# codegen
prettyplease = "0.3"
proc-macro2 = "1.0"
quote = "1.0"
syn = "3.0"

[package]
name = "eks"
version = "0.17.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version = "1.96.1"
readme = "README.md"
description = "Elektronisch kandidaatstellingssysteem"
documentation = "https://kiesraad.github.io/e-KS/e_ks/"
repository = "https://github.com/kiesraad/e-KS"

[features]
default = []
development = ["database", "migrations", "fixtures", "livereload", "dev-features", "db-tests", "net-tests", "tvs-mock"]
# Production build feature set
production = ["database", "memory-serve", "tls", "acme"]
# Development-only defaults (relaxes some config requirements) + dev login endpoint
dev-features = []
# Talk to the online TVS mock service, never enable for a real deployment.
tvs-mock = ["auth-service/tvs-mock"]
# Enable database-backed storage via Postgres / SQLx.
database = ["dep:sqlx"]
# Run database migrations on startup.
migrations = ["database"]
# Load fixture data on startup (dev/test).
fixtures = []
# Enable database-dependent tests.
db-tests = ["database"]
# Enable network-dependent tests.
net-tests = []
# Verify the per-event hash chain when replaying persisted events. Adds a
# SHA-256 over every event's stored bytes on load; off by default.
verify-event-hash-chain = []
# Live-reload assets/templates during development.
livereload = []
# Serve embedded static assets from memory.
memory-serve = ["dep:memory-serve"]
# Serve over HTTPS via rustls and connect to the database over TLS (production deployments)
tls = ["dep:axum-server", "dep:rustls", "sqlx?/tls-rustls-aws-lc-rs", "reqwest/rustls"]
# Renew the TLS certificate via ACME (Let's Encrypt)
acme = ["tls", "database", "dep:instant-acme", "dep:x509-parser", "dep:rcgen", "dep:time"]

[dependencies]
aes-gcm = { workspace = true, features = ["zeroize"] }
askama = { workspace = true }
async_zip = { workspace = true }
auth-service = { path = "auth-service" }
axum = { workspace = true, features = ["multipart", "macros"] }
axum-extra = { workspace = true, features = ["routing", "typed-routing", "form", "typed-header"] }
axum-server = { workspace = true, optional = true }
bagatel = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["now"] }
chrono-tz = { workspace = true }
csv = { workspace = true }
eml-nl = { workspace = true }
eks-utils = { path = "tools/utils" }
hkdf = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }
instant-acme = { workspace = true, optional = true }
memory-serve = { workspace = true, optional = true }
parking_lot = { workspace = true }
phf = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true, optional = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["form", "rustls"] }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true }
subtle = { workspace = true }
textris-pdf = { workspace = true }
time = { workspace = true, optional = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
validate = { path = "validate" }
x509-parser = { workspace = true, optional = true }
zeroize = { workspace = true }

[build-dependencies]
eks-districts-codegen = { path = "tools/districts-codegen" }
eks-locales = { path = "tools/locales" }
memory-serve = { workspace = true, optional = true }

[dev-dependencies]
eks-locales = { path = "tools/locales" }
futures-lite = { workspace = true }
tower = { workspace = true }
tracing-test = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true, features = ["rustls"] }

[lints]
workspace = true

# https://askama.readthedocs.io/en/stable/performance.html#slow-debug-recompilations
[profile.dev.package.askama_derive]
opt-level = 3
