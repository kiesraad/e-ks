button:
  digid: Inloggen
cancelled:
  message: The login was cancelled. You are not logged in to Candidate Nomination of the Kiesraad. Log in again to continue.
confirm_logout:
  cancel: Back
  message: Do you want to log out?
  submit: Log out
  title: Log out
error:
  message: Logging in to this organisation did not succeed. Please try again later. Still not working? Log in to Mijn DigiD to check that your DigiD works correctly. There may be a malfunction at the organisation you are logging in to.
  title: Login failed
session_expiry:
  expired: "Your session has expired because you were inactive for {} minutes. Log in again to continue."
  extend: Stay logged in
  logout: Log out now
  message: You have been inactive for a while. For security reasons you will be logged out automatically if you do nothing. Changes that have not been saved will then be lost.
  message_final: Your session has reached its maximum duration and cannot be extended. Save your work; after that you will have to log in again.
  remaining: Time remaining
  title: Your session is about to expire
signed_out:
  message: "You have been logged out. Close your browser to end the session completely, or log in again."
  title: You have been logged out
start:
  app_description: Use this application to create the paper documents needed for nomination day.
  app_title: Candidate nomination
  intro: Log in via the button below to access the Candidate Nomination application of the Kiesraad.
  title: Log in
unavailable:
  message: The login service is currently unavailable. Please try again in a few minutes.
  title: Login temporarily unavailable
