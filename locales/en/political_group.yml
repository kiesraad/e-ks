substitute_submitters_info: An omission is an error or something incomplete in the submitted documents. Only the list submitter and the appointed substitute submitters may remedy omissions at the central electoral committee. We advise you to appoint at least one substitute submitter.
type:
  appellation_combined_hint: "Rules for the combined name:"
  appellation_combined_hint_combine: "<strong>Combine</strong> Join the officially registered names (or their abbreviations) and separate them with a hyphen (-) or slash (/)."
  appellation_combined_hint_length: "<strong>Length</strong> The name may be no more than 35 characters long. Spaces, punctuation marks, parentheses and hyphens do not count towards these 35 characters."
  appellation_combined_hint_no_additions: "<strong>No additions</strong> You may not add extra letters, words or characters that are not part of the official political group names."
  appellation_hint: Enter the name of the political group as registered with the central electoral committee. This name will be displayed above the list on the ballot paper.
  blank_name: Blank list
  blank_name_hint: There is no appellation.
  legal_name_hint: The name registered in the notarial deed and with the Chamber of Commerce.
  name_combination: Combination of multiple registered names
  name_combination_hint: "The political group has formed an alliance with one or more other registered political groups. Together, they nominate all candidates for the candidate list."
  one_to_fifteen_seats: 1 to 15 seats
  previous_election_results_combined: "In the previous {}, the combination of political groups, or one of the political groups separately, obtained:"
  previous_election_results_combined_hint: "If the political groups participated separately in the previous election, select the highest number of seats obtained by any one of the political groups. Do not take the sum of all seats combined."
  previous_election_results_hint: "The number of seats obtained in the previous election determines:"
  previous_election_results_hint_candidates: if the number of candidates allowed on the list is 50 or 80;
  previous_election_results_hint_support: if you must submit declarations of support;
  registered_name: Standalone registered name
  registered_name_hint: The political group participates in the election with a registered name.
  sixteen_or_more_seats: 16 or more seats
