list_submitter_info_check: Op de dag van kandidaatstelling controleert het centraal stembureau de ingeleverde stukken. Blijkt tijdens de controle dat er iets fout of onvolledig is? Dan heet dit een verzuim. De lijstinleveraar ontvangt per post een brief met alle verzuimen na de controle.
