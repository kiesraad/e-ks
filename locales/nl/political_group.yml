substitute_submitters_info: Een verzuim is een fout of onvolledigheid in de overhandigde stukken. Alleen de lijstinleveraar en de opgegeven vervangers mogen verzuimen herstellen bij het centraal stembureau. Wij adviseren om ten minste één vervanger op te geven.
