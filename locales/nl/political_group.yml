list_submitter_address_info: Naar dit adres wordt de verzuimbrief verstuurd.
list_submitter_data: Gegevens lijstinleveraar
list_submitter_info: "Het centraal stembureau controleert de stukken die worden overhandigd op de dag van kandidaatstelling. Mochten hierbij verzuimen worden vastgesteld, dan ontvangt u hierover schriftelijk bericht. In het bericht dat u van het centraal stembureau ontvangt staat ook tot wanneer verzuimen kunnen worden hersteld. De lijstinleveraar is de enige persoon die bevoegd is om de kandidatenlijst in te leveren."
