  appellation_combined_hint_length: "<strong>Lengte</strong> De naam mag maximaal 35 tekens lang zijn. Spaties, leestekens, haakjes en verbindings\u00ADstreepjes tellen niet mee voor deze 35 tekens."
  appellation_combined_hint_no_additions: "<strong>Geen toevoegingen</strong> U mag geen extra letters, woorden of tekens toevoegen die niet bij de officiële partijnamen horen."
  appellation_hint: Vul hier de partijnaam in die geregistreerd is bij het centraal stembureau. Deze naam komt boven de lijst op het stembiljet te staan.
