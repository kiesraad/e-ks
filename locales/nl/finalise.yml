collection:
  gather_h9: Verzamel de handtekening van alle kandidaten op de instemmings\u00ADverklaringen (H\u00A09). Zorg ook voor leesbare kopieën van de benodigde identiteitsbewijzen.
  pre_submission: "De week voor de dag van kandidaatstelling kunt u de documenten alvast laten controleren door het centraal stembureau tijdens de zogeheten 'voorinlevering'. Maak hiervoor een afspraak bij het centraal stembureau."
  title: "Verzamelen, controleren en ondertekenen"
complete_list:
  no_problems_description: De documenten zijn nu klaar om ingeleverd te worden op papier bij het centraal stembureau. Zij controleren de papieren documenten en de persoonsgegevens.
  no_problems_title: Er zijn geen fouten ontdekt door deze applicatie.
  title: Maak uw lijst compleet
correction:
  description: "Als u een verzuimbrief heeft ontvangen, heeft de politieke groepering vervolgens enkele dagen de tijd om de stukken te corrigeren en opnieuw in te leveren."
  title: Herstellen en herinleveren
  until: "Herinleveren kan bij het centraal stembureau van <strong>{}</strong> tot uiterlijk <strong>{}</strong>, <strong>{}</strong> uur"
delivery:
  appointment: "Maak hiervoor een afspraak. Het adres is:"
  description: "Op de dag van kandidaatstelling dient u uw documenten in te leveren bij het centraal stembureau tussen <strong>09:00</strong> en <strong>17:00</strong>."
  only_on: "De dag van kandidaatstelling is op <strong>{}</strong>"
  title: Documenten inleveren
follow_up_steps:
  description: Hieronder wordt de rest van het kandidaatstellings\u00ADproces tot en met de openbare zitting beschreven.
  title: De volgende stappen buiten deze applicatie
hearing:
  date: "De zitting is op <strong>{}</strong> om <strong>{}</strong>"
  description: "Het centraal stembureau stelt in een openbare zitting vast welke partijen er op het stembiljet komen te staan, en wat de volgorde van de partijen is."
  open_to_public: U kunt de zitting bijwonen.
  title: Definitieve vaststelling kandidatenlijsten
intro:
  description: "U heeft uw kandidaten en kandidatenlijsten aangemaakt. Om af te ronden, zijn er nog een paar stappen te doorlopen. Deze stappen staan uiteengezet op deze pagina."
  title: Nog een paar stappen
omission_letter:
  description: "De brief waarin staat welke stukken ontbreken of onjuist zijn, ontvangt u per post."
  sent: "De brief wordt verstuurd op <strong>{}</strong>"
  title: Ontvangst verzuimbrief
omission_steps:
  title: Extra stappen bij ontbrekende of onjuiste stukken
print:
  download_description: Zorg ervoor dat de laatst gemaakte wijzigingen in deze applicatie overeenkomen met de laatst gedownloade zip.
  download_title: Download hier de bestanden en print ze
  eml_not_required: Het bijgevoegde EML-bestand hoeft niet geprint te worden en hoeft ook niet ingeleverd te worden bij het centraal stembureau.
  errors_warning: "Voordat u de documenten kunt printen, moet u eerst alle fouten in stap 1 oplossen."
  h1_description: "Met de H\u00A01 stelt u, als inleveraar van de kandidatenlijst, kandidaten verkiesbaar voor een verkiezing."
  h1_title: Kandidatenlijst (H\u00A01)
  h3_1_description: Met de H\u00A03-1 krijgt de inleveraar van de kandidatenlijst toestemming om de aanduiding die door uw politieke groepering is geregistreerd boven de kandidatenlijst te plaatsen. Deze toestemming kan alleen worden gegeven door iemand die hiertoe gemachtigd is door de politieke groepering.
  h3_1_title: Machtiging plaatsen van aanduiding (H\u00A03-1)
  h3_2_description: Met de H\u00A03-2 krijgt de inleveraar van de kandidatenlijst toestemming om de samengevoegde aanduiding boven de kandidatenlijst te plaatsen. Deze toestemming moet worden gegeven door iemand die hiertoe gemachtigd is van ieder van de betrokken politieke groeperingen.
  h3_2_title: Machtiging plaatsen van samengevoegde aanduiding (H\u00A03-2)
  h4_description: "Met de H\u00A04 verzamelt uw politieke groepering ondersteunings\u00ADverklaringen van kiesgerechtigde kiezers. Dit is vereist voor politieke groeperingen die niet reeds vertegenwoordigd zijn in {} of deelnemen met een blanco lijst."
  h4_title: Ondersteunings\u00ADverklaringen (H\u00A04)
  h9_consent: Met dit formulier stemmen kandidaten ermee in dat ze op de kandidatenlijst staan. Ook stemmen ze in met hun positie op de lijst.
  h9_identity: "Is de kandidaat nog geen lid van {}? Voeg dan een kopie van een geldig identiteitsbewijs bij de instemmings\u00ADverklaring toe."
  h9_title: Instemmings\u00ADverklaringen (H\u00A09)
  incomplete_warning: "<strong>Let op!</strong> U kunt de documenten wel printen, maar ze zullen als incompleet worden beschouwd door het centraal stembureau. Los de waarschuwingen in stap 1 op om de lijst compleet te maken."
  title: Print de documenten
  usb_not_required: Deze documenten hoeven <strong>niet</strong> meer met een usb-stick digitaal overhandigd te worden.
verification:
  correction_notice: "Mocht er iets ontbreken, dan krijgt u van ons per brief een bericht met de verzuimen."
  description: Het centraal stembureau onderzoekt uw ingediende documenten op volledigheid en correctheid.
  title: Onderzoek van documenten
  until: "Het onderzoek loopt tot en met <strong>{}</strong>"
