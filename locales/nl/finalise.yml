collection:
  gather_h9: Verzamel van alle kandidaten de handtekeningen op de H 9 instemmings\u00ADverklaringen. Zorg ook dat alle kopieën van identiteitsbewijzen meegeleverd worden en leesbaar zijn.
  pre_submission: "De 2 weken voor de dag van kandidaatstelling kunt u de documenten alvast laten controleren door het centraal stembureau, de zogeheten 'voorinlevering'. Maak hiervoor een afspraak."
  title: "Verzamelen, controleren en ondertekenen"
complete_list:
  title: Maak uw lijst compleet
correction:
  deadline: "Uiterlijk <strong>{}</strong> om <strong>17:00</strong> dient het centraal stembureau de ontbrekende stukken te ontvangen."
  description: "Als u een verzuimbrief heeft ontvangen, heeft de politieke groepering vervolgens drie dagen de tijd om de stukken te corrigeren en opnieuw in te leveren."
  title: Verzuimperiode
  until: "Verzuim kan hersteld worden tot <strong>{}</strong>"
delivery:
  appointment: "Maak hiervoor een afspraak. Het adres is:"
  description: "Op de dag van kandidaatstelling dient u uw documenten in te leveren bij het centraal stembureau tussen <strong>09:00</strong> en <strong>17:00</strong> ."
  only_on: "De dag van kandidaatstelling is op <strong>{}</strong>"
  title: Documenten inleveren
follow_up_steps:
  description: Na het printen van de documenten zijn er nog enkele vervolgstappen die u buiten deze applicatie moet zetten. Hieronder wordt de rest van het kandidaatstellings\u00ADproces tot en met de openbare zitting beschreven.
  title: Vervolgstappen buiten dit systeem
hearing:
  date: "De zitting is op <strong>{}</strong> om <strong>{}</strong>"
  description: "Bij deze zitting bepaalt het centraal stembureau welke partijen er op het stembiljet komen te staan, en wordt indien nodig door een loting de volgorde van partijen bepaald."
  open_to_public: U kunt de zitting bijwonen.
  title: Openbare zitting
print:
  download_description: Houd er rekening mee dat de laatste wijzigingen uit dit systeem overeenkomen met de laatst gedownloade zip.
  download_title: Download hier de bestanden en print ze uit.
  eml: Per kandidatenlijst is ook een EML bestand van de kandidatenlijst aanwezig. EML is een bestandsformaat dat softwarematig verwerkbaar is. Dit document hoeft niet ingeleverd te worden.
  eml_title: EML210 Kandidatenlijst
  errors_warning: "Voordat u de documenten kunt printen, moet u eerst alle fouten in stap 1 oplossen."
  h1_description: "Met de H 1 stelt u, als inleveraar van de kandidatenlijst, kandidaten verkiesbaar voor een verkiezing."
  h1_title: H 1 Kandidatenlijst
  h3_1_description: Met de H 3-1 krijgt de inleveraar van de kandidatenlijst toestemming om de aanduiding die door uw politieke groepering is geregistreerd boven de kandidatenlijst te plaatsen. Deze toestemming kan alleen worden gegeven door iemand die hiertoe gemachtigd is door de politieke groepering.
  h3_1_title: H 3-1 Machtiging plaatsen van aanduiding
  h3_2_description: Met de H 3-2 krijgt de inleveraar van de kandidatenlijst toestemming om de samengevoegde aanduiding boven de kandidatenlijst te plaatsen. Deze toestemming moet worden gegeven door iemand die hiertoe gemachtigd is van ieder van de betrokken politieke groeperingen.
  h3_2_title: H 3-2 Machtiging plaatsen van samengevoegde aanduiding
  h4_description: Met de H 4 verzamelt uw politieke groepering ondersteunings\u00ADverklaringen van kiesgerechtigde kiezers. Dit is vereist voor politieke groeperingen die niet reeds vertegenwoordigd zijn in het betreffende orgaan of deelnemen met een blanco lijst.
  h4_title: H 4 Ondersteunings\u00ADverklaringen
  h9_consent: Met dit formulier stemmen kandidaten ermee in dat ze op de kandidatenlijst staan. Ook stemmen ze in met hun positie op de lijst.
  h9_identity: Bij het inleveren van deze H 9 hoort ook een leesbare kopie van het identiteitsbewijs.
  h9_title: H 9 Instemmings\u00ADverklaringen
  incomplete_warning: "Let op! U kunt de documenten wel printen, maar ze zullen als incompleet worden beschouwd door het centraal stembureau. Los de waarschuwingen in stap 1 op om de lijst compleet te maken."
  title: Print de documenten uit
verification:
  correction_notice: "Mocht er iets ontbreken, dan krijgt u van ons per brief een bericht met de verzuimen."
  description: Het centraal stembureau onderzoekt uw ingediende documenten op volledigheid en juistheid.
  title: Onderzoek van documenten
  until: "Het onderzoek loopt tot en met <strong>{}</strong>"
