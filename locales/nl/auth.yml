button:
  digid: Inloggen met DigiD
cancelled:
  message: U heeft het inloggen afgebroken. U bent niet ingelogd bij Kandidaatstelling van de Kiesraad. Log opnieuw in om verder te gaan.
  title: Inloggen geannuleerd
confirm_logout:
  cancel: Terug
  message: Wilt u uitloggen?
  submit: Uitloggen
  title: Uitloggen
error:
  message: Inloggen bij deze organisatie is niet gelukt. Probeert u het later nog een keer. Lukt het nog steeds niet? Log in bij Mijn DigiD. Zo controleert u of uw DigiD goed werkt. Mogelijk is er een storing bij de organisatie waar u inlogt.
  title: Inloggen niet gelukt
signed_out:
  message: "U bent uitgelogd. Sluit uw browser om de sessie helemaal af te sluiten, of log opnieuw in."
  title: U bent uitgelogd
start:
  app_description: Deze applicatie helpt je met het genereren van de papieren documenten die nodig zijn voor de dag van de kandidaatstelling.
  app_title: Kandidaat\u00ADstellen
  intro: "U logt eerst in. Daarna heeft u toegang tot de applicatie Kandidaatstelling van de Kiesraad. Klik op de knop hieronder om in te loggen, u doorloopt dan stapsgewijs het inlogproces."
  title: Inloggen
unavailable:
  message: De inlogdienst is op dit moment niet beschikbaar. Probeert u het over enkele minuten opnieuw.
  title: Inloggen tijdelijk niet mogelijk
