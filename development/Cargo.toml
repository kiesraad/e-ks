[package]
name = "eks-development"
version = "0.5.11"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "dev"
test = false

[[bin]]
name = "setup"
test = false

[[bin]]
name = "update_locales"
test = false

[[bin]]
name = "pdf_diff"
test = false
required-features = ["pdf-diff"]

[[bin]]
name = "create_acme_account"
test = false
required-features = ["acme"]

[features]
pdf-diff = ["dep:eks", "eks/examples", "dep:tracing", "dep:tracing-subscriber"]
acme = ["dep:eks", "eks/acme"]

[dependencies]
anyhow = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
saphyr = { workspace = true }
serde-saphyr = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
eks = { path = "..", default-features = false, optional = true }
eks-locales = { path = "../tools/locales" }

[lints]
workspace = true
