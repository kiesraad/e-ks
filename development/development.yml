children:
  - name: esbuild
    command: ./bin/esbuild
    args:
      - --bundle
      - --watch=forever
      - --serve=127.0.0.1:8888
      - --servedir=frontend/static/
      - --outdir=frontend/static/
      - --public-path=/static/
      - --loader:.woff2=file
      - --loader:.svg=file
      - --sourcemap
      - --define:IS_PRODUCTION=false
      - --log-level=warning
      - frontend/index.ts
  - name: docker logs
    command: docker
    args:
      - compose
      - logs
      - --force
      - --since
      - 5s
  - name: cargo watch
    command: cargo
    args:
      - watch
      - --watch
      - src
      - --watch
      - locales
      - --exec
      - run --locked --features development
    wait_for_postgres: true
