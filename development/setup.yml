tools:
  - name: esbuild
    # https://github.com/evanw/esbuild/releases
    version: "0.28.2"
    base_url: "https://registry.npmjs.org/@esbuild"
  - name: biome
    # https://github.com/biomejs/biome/releases
    version: "2.5.12"
    base_url: "https://github.com/biomejs/biome/releases/download/@biomejs/biome@"
commands:
  docker_compose_rm:
    command: docker
    args:
      - compose
      - rm
      - --force
      - --volumes
  docker_compose_up:
    command: docker
    args:
      - compose
      - up
      - --quiet-pull
      - --detach
  build_djlint_docker_image:
    command: docker
    args:
      - build
      - --build-arg
      - UID=__UID__
      - --build-arg
      - GID=__GID__
      - -f
      - development/djlint.Dockerfile
      - -t
      - djlint
      - .
  esbuild_bundle:
    command: ./bin/esbuild
    args:
      - --bundle
      - frontend/index.ts
      - --outdir=frontend/static
      - --minify
      - --sourcemap
      - --define:IS_PRODUCTION=true
      - --loader:.woff2=file
      - --loader:.svg=file
      - --public-path=/static/
  install_cargo_watch:
    command: cargo
    args:
      - install
      - cargo-watch
      - --locked
  install_dylint:
    command: cargo
    args:
      - install
      - --locked
      - cargo-dylint
      - dylint-link
      # Must match `dylint_linting` in the lint libraries' Cargo.toml.
      - --version
      - "6.0.3"
